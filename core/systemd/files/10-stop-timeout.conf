# sauzerOS default: bound how long the per-user service manager waits on a
# service that ignores SIGTERM during logout/shutdown.
#
# Upstream defaults to 90s, so a single wedged desktop application stalls the
# whole reboot behind "A stop job is running for User Manager UID <n>".  Ten
# seconds is enough for a well-behaved app to flush state and exit cleanly.
#
# Override in /etc/systemd/user.conf.d/ to change this system-wide, or give an
# individual unit its own TimeoutStopSec= if it legitimately needs longer.
[Manager]
DefaultTimeoutStopSec=10s
