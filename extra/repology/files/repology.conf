# Local overrides. Loaded after repology.conf.default, so anything not set here
# keeps the upstream default.

# Which repositories to fetch, parse and serve.
#
# repos.d is taken from upstream and pruned to a handful of distributions by the
# package's build script, but that only works at file granularity: one yaml
# defines many repositories. alpine.yaml alone declares nine branches, and
# arch.yaml declares archpower alongside arch. Selecting individual branches has
# to happen here.
#
# The rule is one repository per distribution, tracking its rolling branch where
# there is one, because older release branches roughly double the work of an
# update run for data we do not look at.
#
# Nearly every name below is stable across releases -- edge, cauldron, current
# and the rest do not change when a new version ships. crux_38 is the exception
# and will need bumping when CRUX 3.9 arrives; upstream's crux.yaml will gain it
# and this list will keep selecting the older branch until it is updated here.
REPOSITORIES = [
    'adelie_current',
    'alpine_edge',
    'arch',
    'arch_testing',
    'aur',
    'cpan',
    'crux_38',
    'gentoo',
    'mageia_cauldron',
    'metacpan',
    'pypi',
    'sauzeros',
    'sauzeros-cosmic',
    'sauzeros-kde',
    'slackware64_current',
    'void_x86_64',
]
