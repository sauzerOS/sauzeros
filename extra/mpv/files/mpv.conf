# Defaults for the Raspberry Pi 4. Installed only by the cross build, since
# everything here is about the Pi's hardware.

# The V3D driver here is built for OpenGL only -- libplacebo is cross built
# without vulkan, and so is mpv.
gpu-api=opengl

# Hardware decoding, tried in order:
#   drm       -> hevc_v4l2request, the *stateless* HEVC block at /dev/video19
#                ("rpi-hevc-dec"), driven through the V4L2 Request API. Its
#                only output format is S265 (V4L2_PIX_FMT_HEVC_SLICE) and its
#                capture formats are all SAND (Broadcom column-tiled), which is
#                why ffmpeg here is built from jc-kynesim's Pi fork with
#                --enable-v4l2-request --enable-sand. Covers Main and Main 10.
#   v4l2m2m   -> the stateful h264 block at /dev/video10 (bcm2835-codec).
#                Frames come out as DRM_PRIME dma-bufs, so no copy back.
# mpv falls back to software on its own for anything neither block handles
# (AV1 -> dav1d), so this is safe to leave on.
#
# Upstream ffmpeg cannot do either: it has no request-API code at all, and its
# v4l2_m2m hangs forever -- zero frames returned -- on any H.264 stream whose
# SPS sets colour_description_present_flag, which every real-world encode does.
# The fork's rewritten v4l2_m2m decodes those files correctly.
hwdec=drm,v4l2m2m

# Not optional on this hardware. mpv's default scalers are far too expensive
# for the V3D at 2560x1440: a 1080p file fullscreen dropped 195 of ~480 frames
# with defaults and 0 with profile=fast, while the decoder dropped none either
# way. The frame drops people blame on decoding here are almost always this.
profile=fast

# MUST come after profile=fast, which otherwise selects vo=gpu-next.
#
# gpu-next (libplacebo 7.360.1 on this V3D) leaks one `anon_inode:sync_file`
# fd per rendered frame and never closes it. A process hits the default
# RLIMIT_NOFILE of 1024 in well under a minute of playback and then dies with
#     [vo/gpu-next/drmprime] Failed to duplicate dmabuf fd: Too many open files
# which reads like a dmabuf/hwdec problem but is not: the leaked fds are sync
# fences, and it leaks identically with hwdec=no. dmabuf duplication is simply
# the first thing to fail once the table is full.
#
# Measured over 40s of playback: gpu-next 243 -> 1024 fds, gpu 60 -> 60.
# Over 170s vo=gpu stayed exactly flat, and it drops no more frames than
# gpu-next does here. Revisit if libplacebo is updated.
vo=gpu

# Measured 2026-09-19, 20s fullscreen at 2560x1440, CPU time:
#   h264 1080p   software 16.4s -> hwdec 2.2s
#   HEVC Main10  software 51.7s -> hwdec 2.5s
